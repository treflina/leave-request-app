{% extends 'base_login.html' %}
{% block content %}
<main
	class="!my-0 !flex !min-h-screen !h-auto !w-full !flex-nowrap !items-center !justify-center px-6 py-10">
	<section class="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl"
		aria-labelledby="reset-sent-heading">
		<h1 id="reset-sent-heading" class="text-2xl font-bold text-[#545460]">
			Wysłano instrukcję resetowania hasła
		</h1>
		<p class="mt-4 text-sm leading-6 text-slate-700">
			Instrukcja ustawienia nowego hasła została wysłana na podany adres e-mail.
		</p>
		<p class="mt-3 text-sm leading-6 text-slate-700">
			Jeśli wiadomość nie dotrze, sprawdź adres w kadrach oraz folder SPAM.
		</p>
		<a href="{% url 'users_app:user-login' %}"
			class="mt-6 inline-flex rounded-lg bg-[#1f7a35] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#17612a] focus:outline-none focus:ring-2 focus:ring-[#28a745] focus:ring-offset-2">
			Wróć do logowania
		</a>
	</section>
</main>
{% endblock content %}
