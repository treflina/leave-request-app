{% load static %}
<div class="inline-flex items-center gap-1.5 justify-end">
    <a href="{% url 'requests_app:changerequest' record.id %}"
       class="btn-sm bg-amber-50  hover:bg-amber-100 shadow-sm">
       Edytuj
    </a>
    {% if record.attachment %}
    <a href="{{ record.attachment.url }}" target="_blank"
       class="inline-flex items-center justify-center p-1.5 rounded-lg border border-blue-200
        bg-blue-50 hover:bg-blue-100 text-blue-700 shadow-sm transition-colors"
       title="Zobacz załącznik">
        <svg class="h-5 w-5" aria-hidden="true" focusable="false">
            <use href="{% static 'img/svg/sprite.svg' %}#attachment"></use>
        </svg>
    </a>
    {% endif %}
</div>
