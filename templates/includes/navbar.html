{% load static %}

<nav
    class="w-full bg-[#545460] shadow-sm"
    aria-label="Główna nawigacja"
>
    <div
        class="mx-auto flex h-14 w-full max-w-[1350px] items-center justify-between
               px-4 sm:px-6 lg:px-8"
    >
        <a
            href="{% url 'home_app:index' %}"
            class="shrink-0 rounded-md
                   focus:outline-none
                   focus-visible:ring-2
                   focus-visible:ring-white
                   focus-visible:ring-offset-2
                   focus-visible:ring-offset-[#575864]"
            aria-label="Strona główna"
        >
            <picture class="sm:hidden">
                <source
                    media="(max-width: 639px)"
                    srcset="{% static 'img/mbp_logo7.png' %}"
                >

                <img
                    src="{% static 'img/mbp_logo7.png' %}"
                    alt="MBP"
                    class="block w-auto h-12"
                >
            </picture>
            <picture class="hidden sm:block">
                <source
                    media="(max-width: 639px)"
                    srcset="{% static 'img/logo_white.png' %}"
                >

                <img
                    src="{% static 'img/logo_white.png' %}"
                    alt="MBP"
                    class="block w-auto h-12 sm:h-20"
                >
            </picture>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">

            {% if main_page %}

                <button
                    type="button"
                    id="settings-open-btn"
                    class="inline-flex items-center gap-2
                           rounded-full
                           border border-white/50
                           bg-transparent
                           px-3 py-2
                           text-sm font-semibold
                           text-white
                           transition-colors
                           cursor-pointer
                           hover:bg-white/10
                           hover:border-white
                           focus:outline-none
                           focus-visible:ring-2
                           focus-visible:ring-white
                           focus-visible:ring-offset-2
                           focus-visible:ring-offset-[#575864]
                           active:bg-white/20"
                    aria-label="Ustawienia powiadomień"
                    aria-controls="settingsModal"
                >
                    <svg
                        class="h-5 w-5 text-white sm:hidden"
                        aria-hidden="true"
                        focusable="false"
                        >
                            <use
                                href="{% static 'img/svg/sprite.svg' %}#gear"
                            ></use>
                    </svg>
                    <span class="hidden sm:inline">
                        Ustawienia
                    </span>
                </button>
                <a
                    href="{% url 'users_app:user-update' %}"
                    class="inline-flex items-center rounded-full
                           border border-white/50
                           bg-transparent
                           px-3 py-2
                           text-center
                           text-sm font-semibold
                           text-white
                           transition-colors
                           hover:bg-white/10
                           hover:border-white
                           focus:outline-none
                           focus-visible:ring-2
                           focus-visible:ring-white
                           focus-visible:ring-offset-2
                           focus-visible:ring-offset-[#575864]
                           active:bg-white/20"
                >
                    Zmień hasło
                </a>
                <form method="post" action="{% url 'users_app:user-logout' %}">
                    {% csrf_token %}
                    <button
                        type="submit"
                        class="inline-flex items-center rounded-full
                            bg-green-700
                            px-4 py-2
                            text-sm font-semibold
                            text-white
                            shadow-sm
                            transition-colors
                            cursor-pointer
                            hover:bg-green-800
                            focus:outline-none
                            focus-visible:ring-2
                            focus-visible:ring-white
                            focus-visible:ring-offset-2
                            focus-visible:ring-offset-[#575864]
                            active:bg-emerald-900"
                    >
                        Wyloguj się
                    </button>
                </form>
            {% else %}
                <a
                    href="{% url 'home_app:index' %}"
                    class="inline-flex items-center gap-2
                           rounded-full
                           border border-white/50
                           bg-transparent
                           px-4 py-2
                           text-sm font-semibold
                           text-white
                           transition-colors
                           hover:bg-white/10
                           hover:border-white
                           focus:outline-none
                           focus-visible:ring-2
                           focus-visible:ring-white
                           focus-visible:ring-offset-2
                           focus-visible:ring-offset-[#575864]"
                >
                    <svg
                        class="hidden h-5 w-5 sm:block"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <use
                            href="{% static 'img/svg/sprite.svg' %}#home"
                        ></use>
                    </svg>

                    <span>
                        Strona główna
                    </span>
                </a>

            {% endif %}

        </div>
    </div>
</nav>

{% include 'includes/settings.html' %}
