<dialog id="withdrawModal{{ leave_request.id }}"
    aria-labelledby="withdrawModalLabel{{ leave_request.id }}"
    class="w-full max-w-md rounded-xl border-0 bg-white p-0 shadow-xl backdrop:bg-slate-900/40" >
    <div class="p-6">

        <h2
            id="withdrawModalLabel{{ leave_request.id }}"
            class="text-lg font-semibold text-slate-900"
        >
            Odrzucić wniosek?
        </h2>

        <p class="mt-3 text-sm leading-6 text-slate-600">
            Czy na pewno chcesz odrzucić wniosek
            obejmujący okres
            <span class="font-medium text-slate-800">
                {{ leave_request.start_date|date:"d.m.Y" }}
                {% if leave_request.start_date != leave_request.end_date %}
                    – {{ leave_request.end_date|date:"d.m.Y" }}
                {% endif %}
            </span>?
        </p>

        <div
            class="mt-6 flex flex-col-reverse gap-2
                sm:flex-row sm:justify-end"
        >

            <button
                type="button"
                class="btn btn-secondary w-full sm:w-auto"
                onclick="this.closest('dialog').close()"
            >
                Wróć
            </button>

            <form
                method="post"
                action="{% url 'requests_app:reject_request' leave_request.id %}{% if redirect_to %}?next={{ redirect_to }}{% endif %}"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger w-full sm:w-auto"
                >
                    Tak, odrzucam
                </button>
            </form>
        </div>
    </div>
</dialog>
